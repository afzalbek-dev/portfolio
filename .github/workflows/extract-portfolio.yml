name: Extract portfolio source

on:
  push:
    branches: [main]
    paths:
      - 'portfolio.zip'
      - '.github/workflows/extract-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract portfolio archive
        run: |
          unzip -o portfolio.zip -d .

      - name: Remove secrets and sanitize config
        shell: bash
        run: |
          rm -f .env
          python - <<'PY'
          from pathlib import Path
          p = Path('bot/config.py')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              import re
              s = re.sub(r'BOT_TOKEN\s*=\s*os\.getenv\("TELEGRAM_BOT_TOKEN",\s*"[^"]*"\)',
                         'BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "")', s)
              s = re.sub(r'raw_admin_id\s*=\s*os\.getenv\("TELEGRAM_ADMIN_ID",\s*"[^"]*"\)',
                         'raw_admin_id = os.getenv("TELEGRAM_ADMIN_ID", "")', s)
              s = re.sub(r'raw_admin_ids\s*=\s*os\.getenv\("TELEGRAM_ADMIN_IDS",\s*"[^"]*"\)',
                         'raw_admin_ids = os.getenv("TELEGRAM_ADMIN_IDS", "")', s)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Ensure secrets stay ignored
        run: |
          touch .gitignore
          grep -qxF '.env' .gitignore || echo '.env' >> .gitignore
          grep -qxF 'node_modules/' .gitignore || echo 'node_modules/' >> .gitignore
          grep -qxF '__pycache__/' .gitignore || echo '__pycache__/' >> .gitignore
          grep -qxF 'venv/' .gitignore || echo 'venv/' >> .gitignore

      - name: Remove archive after extraction
        run: rm -f portfolio.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract portfolio project source"
            git push
          fi
